<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Remove hidden GPS location, phone model and timestamps from your photos. Runs entirely in your browser; nothing is uploaded." />
    <meta name="referrer" content="no-referrer" />
    <title>PhotoScrub: remove hidden data from your photos</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!--
      Phase 1 UI: deliberately plain. The real layout and visual design
      will be decided together before Phase 2.
    -->
    <main>
      <h1>PhotoScrub</h1>
      <p>Remove hidden location, phone and time data from a photo before you share it.
        <strong>Your photo never leaves this device.</strong></p>

      <label id="drop-zone" for="file-input">
        <span>Drop a photo here, or click to choose one</span>
        <input id="file-input" type="file"
          accept="image/jpeg,image/png,image/webp,image/heic,image/heif,.jpg,.jpeg,.png,.webp,.heic,.heif" />
      </label>

      <section id="result" hidden aria-live="polite"></section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
